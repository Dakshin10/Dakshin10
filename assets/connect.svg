<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img" aria-labelledby="dakshin-raj-connect-t dakshin-raj-connect-d"><title id="dakshin-raj-connect-t">Dakshin Raj — connect</title><desc id="dakshin-raj-connect-d">Let&#x27;s build what&#x27;s next. Linkedin: in/dakshin-raj, Email: dakshinrajponraju@gmail.com, Github: Dakshin10. Clickable links are listed below this card.</desc><style>@font-face{font-family:Display;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:Mono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
